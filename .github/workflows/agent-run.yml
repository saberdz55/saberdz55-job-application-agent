name: Autonomous Job Agent

on:
  workflow_dispatch:
    inputs:
      max_applications:
        description: "Maximum applications for this run"
        required: true
        default: "10"
        type: string
      automation_mode:
        description: "Application mode"
        required: true
        default: "semi_automated"
        type: choice
        options:
          - semi_automated
          - fully_automated

permissions:
  contents: read

concurrency:
  group: autonomous-job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run autonomous agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          USER_PROFILE_JSON: ${{ secrets.USER_PROFILE_JSON }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          MAX_APPLICATIONS: ${{ inputs.max_applications }}
          AUTOMATION_MODE: ${{ inputs.automation_mode }}
        run: python scripts/run_agent.py
