name: Autonomous Job Agent

on:
  workflow_dispatch:
    inputs:
      max_applications:
        description: "Maximum applications for this run"
        required: true
        default: "1"
        type: string
      automation_mode:
        description: "Application mode"
        required: true
        default: "semi_automated"
        type: choice
        options:
          - semi_automated
          - fully_automated

permissions:
  contents: read

concurrency:
  group: autonomous-job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_HEADLESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore encrypted browser sessions
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          NAUKRI_STATE_B64: ${{ secrets.NAUKRI_STATE_B64 }}
          INTERNSHALA_STATE_B64: ${{ secrets.INTERNSHALA_STATE_B64 }}
        run: |
          python -c "from src.browser.session_vault import restore_sessions_from_env; print(restore_sessions_from_env())"

      - name: Run autonomous agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          USER_PROFILE_JSON: ${{ secrets.USER_PROFILE_JSON }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          MAX_APPLICATIONS: ${{ inputs.max_applications }}
          AUTOMATION_MODE: ${{ inputs.automation_mode }}
        run: python scripts/run_agent.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-run-${{ github.run_id }}
          path: |
            data/run_result.json
            data/applications_export.csv
            data/runs/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove ephemeral session files
        if: always()
        run: rm -f configs/naukri_state.enc configs/internshala_state.enc
