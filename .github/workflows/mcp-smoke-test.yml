name: MCP Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import MCP server
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.mcp.server import mcp
          print('MCP_IMPORT_OK')
          print('SERVER_NAME:', mcp.name)
          PY

      - name: Verify server module compiles
        run: python -m py_compile src/mcp/server.py
